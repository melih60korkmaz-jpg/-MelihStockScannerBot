<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101113">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Müteahhit — Temelden Zirveye</title>
<script>
/* Hata görünürlüğü: oyun açılmazsa sebebi ekranda yazsın (gömülü görüntüleyicilerde konsol yok). */
(function(){function show(m){try{var d=document.getElementById('fatal');if(!d){d=document.createElement('pre');d.id='fatal';d.style.cssText='position:fixed;left:8px;right:8px;top:8px;z-index:99999;background:#300;color:#fff;font:12px/1.4 monospace;padding:10px;border-radius:8px;white-space:pre-wrap;max-height:60vh;overflow:auto';(document.body||document.documentElement).appendChild(d)}d.textContent+=m+'\n'}catch(e){}}
window.addEventListener('error',function(e){show('Hata: '+(e.message||'')+' '+(e.filename?'('+String(e.filename).slice(-30)+':'+e.lineno+')':''))});
window.addEventListener('unhandledrejection',function(e){show('Söz hatası: '+(e.reason&&e.reason.message||e.reason))});
setTimeout(function(){if(!window.__booted){show('Oyun 6 sn içinde başlamadı. Bu mesajın ekran görüntüsünü gönderin.')}},6000)})();
</script>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<div id="ui"></div>
<div id="rotate" role="alert"><svg viewBox="0 0 24 24"><rect x="7" y="2.5" width="10" height="19" rx="2.2"/><path d="M11 18.5h2"/></svg><b>Telefonu yatay çevirin</b><span>Müteahhit yatay ekran için tasarlandı.</span></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
