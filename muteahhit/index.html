<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1621">
<title>Müteahhit — Faz 1 Test Paneli</title>
<style>
  :root { --bg:#0E1621; --s1:#16212E; --s2:#1F2D3D; --steel:#8A949E; --gold:#F5B700; --ok:#2ECC8F; --bad:#E5484D; --text:#E8EDF2; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.4 system-ui,-apple-system,sans-serif;
         padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left)); min-height:100dvh; }
  h1 { font-size:20px; margin:0 0 4px; } .sub { color:var(--steel); margin:0 0 16px; font-size:13px; }
  .card { background:var(--s1); border-radius:16px; padding:14px; margin-bottom:12px; border-top:1px solid #ffffff14; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .big { font-size:26px; font-weight:700; font-variant-numeric:tabular-nums; }
  .neg { color:var(--bad); } .pos { color:var(--ok); }
  button { min-height:44px; padding:0 14px; border-radius:12px; border:1px solid #ffffff22; background:var(--s2); color:var(--text); font:inherit; }
  button.cta { background:var(--gold); color:#1a1300; border:0; font-weight:700; }
  button.on { outline:2px solid var(--gold); }
  select, input { min-height:44px; border-radius:12px; border:1px solid #ffffff22; background:var(--s2); color:var(--text); padding:0 10px; font:inherit; }
  ul { list-style:none; padding:0; margin:0; } li { padding:6px 0; border-bottom:1px solid #ffffff10; display:flex; justify-content:space-between; gap:8px; }
  #log { font-size:12px; color:var(--steel); max-height:120px; overflow:auto; }
</style>
</head>
<body>
<h1>Müteahhit — Faz 1</h1>
<p class="sub">Çekirdek, takvim, defter ve kayıt testi (geçici panel; asıl arayüz Faz 2)</p>
<div id="app"></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
