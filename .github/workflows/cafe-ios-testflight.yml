name: Cafe Empire iOS -> TestFlight

# Bu dala itilince (workflow dosyası değişince) ya da elle çalışır.
# Not: "Run workflow" düğmesi yalnızca main'deki workflow'larda görünür.
on:
  workflow_dispatch:
  push:
    branches: [claude/modest-archimedes-etn5kx]
    paths: ['.github/workflows/cafe-ios-testflight.yml']

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: cafe-expo
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Gizli bilgiler tamam mı
        run: |
          for v in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 TEAM_ID; do
            if [ -z "${!v}" ]; then echo "EKSIK secret: $v"; exit 1; fi
          done

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: cafe-expo/package-lock.json

      - name: Oyunu senkronla ve bağımlılıkları kur
        run: |
          npm ci
          ls assets/game.html

      - name: iOS projesini üret
        run: npx expo prebuild --platform ios --no-install --clean && cd ios && pod install

      - name: API anahtarını yaz (biçimi onar ve doğrula)
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          KEY="$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"
          # iPhone'dan yapıştırınca satır sonları bozulabilir: gövdeyi çıkarıp yeniden sar
          BODY=$(printf '%s' "$ASC_KEY_P8" | tr -d '\r' \
            | sed -e 's/-----BEGIN[^-]*-----//' -e 's/-----END[^-]*-----//' \
            | tr -d ' \n\t')
          echo "anahtar govde uzunlugu: ${#BODY} (ES256 .p8 icin ~200 beklenir)"
          { echo "-----BEGIN PRIVATE KEY-----"; printf '%s' "$BODY" | fold -w 64; echo; echo "-----END PRIVATE KEY-----"; } > "$KEY"
          if ! openssl pkey -in "$KEY" -noout 2>/dev/null; then
            echo "HATA: ASC_KEY_P8 gecerli bir ozel anahtar degil (eksik ya da bozuk yapistirilmis)."
            exit 1
          fi
          echo "anahtar gecerli"

      - name: Arşivle (otomatik imza)
        run: |
          cd ios
          WS=$(ls -d *.xcworkspace | head -1)
          SCHEME="${WS%.xcworkspace}"
          echo "scheme=$SCHEME"
          xcodebuild archive \
            -workspace "$WS" -scheme "$SCHEME" -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/app.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}"

      - name: App Store Connect'e yükle
        run: |
          cat > "$RUNNER_TEMP/export.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><true/>
          </dict></plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/app.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
            -exportPath "$RUNNER_TEMP/out" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Temizlik
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
