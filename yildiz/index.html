</style></head><body><div id="app"><div id="score"><div class="t"><span id="hn">SANLIU</span></div><div class="s"><span id="sc">0 - 0</span><small id="mn">0'</small></div><div class="t"><span id="an">İNEGÖL</span></div></div>

<script>

/* ---------- atak kurulumu ---------- */

/* ---------- fizik ---------- */
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

  if (G.faz !== 'oyna') return; G.faz = 'bitti'; G.bitis = 1.4; G.son = sonuc; logla(Math.round(G.dk), mesaj, cls); if (gol) { G.skor[0]++; G.istat.gol++; G.puan += 1.2; vur(); const k = G.top.son; G.cel = { who: k, t: 0, x: k.x < W / 2 ? 6 : W - 6, y: 22 }; G.bitis = 3; } hint(''); skorYaz();
}

/* ---------- hareket izleme: yön, koşu fazı, vuruş/kayma/atlayış zamanlayıcıları ---------- */
function izle(o, dt) { const dx = o.x - o.px, dy = o.y - o.py, sp = Math.hypot(dx, dy) / Math.max(dt, 1e-3); o.sp += (sp - o.sp) * Math.min(1, dt * 10); if (sp > 0.35) { let da = Math.atan2(dy, dx) - o.fa; while (da > Math.PI) da -= 2 * Math.PI; while (da < -Math.PI) da += 2 * Math.PI; o.fa += da * Math.min(1, dt * 12); } o.ph += o.sp * dt * 2.6; o.px = o.x; o.py = o.y; if (o.kick > 0) o.kick -= dt; if (o.slide > 0) o.slide -= dt; if (o.dive > 0) o.dive -= dt; }

/* ---------- girdi: parmakla yön + güç ---------- */
let down = null; const MAXP = 150;

const KIT = { tm: { f: '#f2c518', s: '#d9a800', sh: '#1d3d8f', hair: '#3b2a1a' }, me: { f: '#ffd84a', s: '#e0a800', sh: '#1d3d8f', hair: '#1a1008' }, op: { f: '#d23a2e', s: '#9c241b', sh: '#fff', hair: '#2a1a10' }, gk: { f: '#2fb36b', s: '#1b7a47', sh: '#111', hair: '#4a3020' } };
