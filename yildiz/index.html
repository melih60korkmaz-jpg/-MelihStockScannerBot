<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Yıldız Doğuyor</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:#0e1a12;color:#eef6ee;font-family:-apple-system,system-ui,sans-serif;overflow:hidden;touch-action:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#score{display:flex;align-items:center;justify-content:center;gap:14px;padding:8px 12px;background:#0b130e;font-weight:800;letter-spacing:.04em}
#score .t{flex:1;font-size:13px;opacity:.85}#score .t:last-child{text-align:right}#score .s{font-size:22px;background:#1f3a28;border-radius:8px;padding:2px 12px;min-width:92px;text-align:center}#score small{display:block;font-size:11px;color:#9fc7a9}
#wrap{flex:1;position:relative;min-height:0}canvas{width:100%;height:100%;display:block;touch-action:none}
#log{height:92px;overflow:hidden;background:#0b130e;padding:6px 10px;font-size:13px;display:flex;flex-direction:column-reverse;gap:3px}
#log div{background:#1d3a2a;border-radius:6px;padding:4px 8px;display:flex;gap:8px}#log b{color:#ffd54a;min-width:30px}#log .g{background:#2a6b3a;font-weight:800}#log .k{background:#6b2a2a}
#hint{position:absolute;left:0;right:0;top:12px;text-align:center;font-size:14px;color:#fff;text-shadow:0 1px 3px #000;pointer-events:none;transition:opacity .4s}
#ov{position:absolute;inset:0;background:rgba(8,16,11,.92);display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:24px;z-index:5}
#ov h1{margin:0;font-size:28px}#ov p{margin:0;color:#b9d9c1;max-width:320px;line-height:1.4}#ov button{background:linear-gradient(#3fbf5f,#1f8f3f);border:0;color:#fff;font-weight:800;font-size:18px;padding:14px 40px;border-radius:12px}
</style></head><body><div id="app"><div id="score"><div class="t"><span id="hn">SANLIU</span></div><div class="s"><span id="sc">0 - 0</span><small id="mn">0'</small></div><div class="t"><span id="an">İNEGÖL</span></div></div>
<div id="wrap"><canvas id="c"></canvas><div id="hint"></div><div id="ov"></div></div><div id="log"></div></div>
<script>
'use strict';
const W = 68, H = 105, GOAL_W = 7.32, GX0 = (W - GOAL_W) / 2, GX1 = (W + GOAL_W) / 2, rnd = (a, b) => a + Math.random() * (b - a);
const cv = document.getElementById('c'), cx = cv.getContext('2d'), $ = (i) => document.getElementById(i);
let sc = 1, ox = 0, oy = 0, dpr = Math.min(2, devicePixelRatio || 1);
function fit() { const r = cv.getBoundingClientRect(); cv.width = r.width * dpr; cv.height = r.height * dpr; sc = Math.min(cv.width / (W + 6), cv.height / (H + 6)); ox = (cv.width - W * sc) / 2; oy = (cv.height - H * sc) / 2; }
addEventListener('resize', fit); const toX = (x) => ox + x * sc, toY = (y) => oy + y * sc;
/* ---------- maç durumu ---------- */
const G = { skor: [0, 0], dk: 0, atak: 0, ATAK: 8, faz: 'ön', t: 0, top: null, me: null, tm: [], op: [], gk: null, aim: null, sure: 0, bitis: 0, log: [], istat: { sut: 0, isabet: 0, pas: 0, gol: 0, asist: 0, kayip: 0 }, son: null, puan: 6.0 };
const oyuncu = (x, y, tip) => ({ x, y, tip, vx: 0, vy: 0, h0x: x, h0y: y });
function logla(dk, m, cls) { G.log.unshift({ dk, m, cls }); const el = $('log'); el.innerHTML = G.log.slice(0, 5).map((l) => `<div class="${l.cls || ''}"><b>${l.dk}'</b><span>${l.m}</span></div>`).join(''); }
function skorYaz() { $('sc').textContent = G.skor[0] + ' - ' + G.skor[1]; $('mn').textContent = Math.round(G.dk) + "'"; }
function hint(m) { const h = $('hint'); h.textContent = m || ''; h.style.opacity = m ? 1 : 0; }
/* ---------- atak kurulumu ---------- */
function yeniAtak() {
  G.atak++; G.dk = Math.min(90, (G.atak - 1) * 11 + 3); skorYaz(); const z = Math.min(4, 1 + Math.floor(G.atak / 3));
  const me = oyuncu(W / 2 + rnd(-8, 8), rnd(66, 76), 'me'); G.me = me; G.top = { x: me.x, y: me.y, vx: 0, vy: 0, tasiyan: me, son: 0 };
  G.tm = [oyuncu(14, 60, 'tm'), oyuncu(54, 58, 'tm'), oyuncu(24, 44, 'tm'), oyuncu(46, 40, 'tm')]; G.tm.forEach((t) => { t.h0x += rnd(-4, 4); t.h0y += rnd(-4, 4); });
  G.op = []; const n = 3 + z; for (let i = 0; i < n; i++) G.op.push(oyuncu(rnd(10, 58), rnd(18, 56), 'op')); G.gk = oyuncu(W / 2, 3, 'gk'); G.gk.dive = 0;
  G.faz = 'oyna'; G.sure = 0; G.aim = null; G.atakPas = 0; G.durum = 'Koş ve parmağını sürükle: yön + güç'; hint(G.atak === 1 ? 'Parmağını sürükle: yön ve güç. Takım arkadaşına ya da kaleye bırak!' : '');
}
/* ---------- fizik ---------- */
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
function bitirAtak(sonuc, mesaj, cls, gol) {
  if (G.faz !== 'oyna') return; G.faz = 'bitti'; G.bitis = 1.4; G.son = sonuc; logla(Math.round(G.dk), mesaj, cls); if (gol) { G.skor[0]++; G.istat.gol++; G.puan += 1.2; vur(); } hint(''); skorYaz();
}
let sarsinti = 0; const vur = () => { sarsinti = 0.5; };
function adim(dt) {
  G.t += dt; if (sarsinti > 0) sarsinti -= dt; const yavas = G.aim ? 0.18 : 1, d = dt * yavas, top = G.top;
  if (G.faz === 'bitti') { G.bitis -= dt; if (G.bitis <= 0) { if (G.atak >= G.ATAK) macSonu(); else { rakipAtagi(); yeniAtak(); } } return; }
  if (G.faz !== 'oyna') return; G.sure += d;
  // taşıyıcı: kaleye doğru, savunmacılardan kaçınarak koşar
  if (top.tasiyan) { const m = top.tasiyan; let ax = 0, ay = -1; for (const o of G.op) { const dd = dist(m, o); if (dd < 9) { ax += (m.x - o.x) / (dd + 1) * 1.6; ay += (m.y - o.y) / (dd + 1) * 0.6; } } ax += (W / 2 - m.x) * 0.012; const l = Math.hypot(ax, ay) || 1, v = 4.4; m.x += ax / l * v * d; m.y += ay / l * v * d; m.x = Math.max(2, Math.min(W - 2, m.x)); if (m.y < 6) m.y = 6; top.x = m.x; top.y = m.y; top.vx = top.vy = 0; if (G.sure > 14) return bitirAtak('kayip', 'Top çok beklendi, rakip topu kaptı.', 'k'); }
  else {
    top.x += top.vx * d; top.y += top.vy * d; const f = Math.pow(0.5, d / 1.3); top.vx *= f; top.vy *= f; const sp = Math.hypot(top.vx, top.vy);
    if (top.y <= 0.3 && top.x > GX0 && top.x < GX1 && top.vy < 0) return sutSonuc();
    if (top.y < -2 || top.y > H + 2 || top.x < -2 || top.x > W + 2) { if (top.y < 0.3 && sp > 2) { G.istat.sut++; return bitirAtak('aut', 'Şut auta gitti.', 'k'); } return bitirAtak('kayip', 'Top çizgiyi geçti, atak bitti.', 'k'); }
    for (const t of G.tm) if (t !== top.son && dist(t, top) < 2.8 && sp > 0.5) { G.istat.pas++; G.atakPas++; G.puan += 0.1; top.tasiyan = t; G.me = t; top.son = t; top.vx = top.vy = 0; hint(''); break; }
    for (const o of G.op) if (dist(o, top) < 1.7 && !top.tasiyan) { G.istat.kayip++; G.puan -= 0.25; return bitirAtak('kayip', 'Pas kesildi! Rakip topu aldı.', 'k'); }
    if (sp < 1.2 && !top.tasiyan) { const t = G.tm.concat([G.me]).sort((a, b) => dist(a, top) - dist(b, top))[0]; if (dist(t, top) < 4) { top.tasiyan = t; G.me = t; } else return bitirAtak('kayip', 'Top yavaşladı, rakip aldı.', 'k'); }
  }
  // rakipler taşıyıcıya/topa koşar
  for (const o of G.op) { const hx = top.tasiyan ? top.tasiyan.x : top.x, hy = top.tasiyan ? top.tasiyan.y : top.y, dd = Math.hypot(hx - o.x, hy - o.y) || 1, v = 3.4 + G.atak * 0.12; o.x += (hx - o.x) / dd * v * d; o.y += (hy - o.y) / dd * v * d; if (top.tasiyan && dd < 1.5) { G.istat.kayip++; G.puan -= 0.3; return bitirAtak('kayip', 'Rakip savunmacı topu çaldı!', 'k'); } }
  for (const t of G.tm) if (t !== top.tasiyan) { if (!top.tasiyan && t !== top.son && dist(t, top) < 11) { const dd = dist(t, top) || 1; t.x += (top.x - t.x) / dd * 5 * d; t.y += (top.y - t.y) / dd * 5 * d; continue; } const hx = t.h0x, hy = Math.max(10, t.h0y - Math.max(0, 70 - (top.tasiyan ? top.tasiyan.y : 50)) * 0.2 + Math.sin(G.t * 0.9 + t.h0x) * 3); t.x += (hx - t.x) * 0.8 * d + Math.cos(G.t + t.h0y) * 0.4 * d; t.y += (hy - t.y) * 0.8 * d; }
  // kaleci topun x'ine doğru kayar
  let hdf = (top.x - W / 2) * 0.45 + W / 2, vk = 3; if (!top.tasiyan) { G.gk.rt = (G.gk.rt || 0) + d; if (top.vy < -1 && G.gk.rt > 0.3) { hdf = top.x + top.vx * (top.y / -top.vy); vk = 3.6; } } G.gk.x += Math.max(-vk * d, Math.min(vk * d, (Math.min(GX1 - 0.4, Math.max(GX0 + 0.4, hdf)) - G.gk.x)));
}
function sutSonuc() {
  const top = G.top, kx = G.gk.x, hiz = Math.hypot(top.vx, top.vy), carp = top.x; G.istat.sut++; const yakin = Math.abs(carp - kx), reaksiyon = 0.8 + 3.5 / Math.max(5, hiz), gol = yakin > reaksiyon || hiz > 16 && yakin > 0.8;
  if (carp < GX0 + 0.35 || carp > GX1 - 0.35) { G.istat.isabet++; return bitirAtak('direk', 'DİREK! Top direğe çarptı, az kalsın!', 'k'); }
  G.istat.isabet++; if (gol) { if (G.atakPas > 0) { G.istat.asist++; } return bitirAtak('gol', G.atakPas > 0 ? 'GOOOL! Harika asist ve soğukkanlı bitiriş!' : 'GOOOOL! Muhteşem şut!', 'g', true); }
  G.puan += 0.2; bitirAtak('kurtaris', 'Kaleci son anda kurtardı!', 'k');
}
function rakipAtagi() { const r = Math.random(), ata = 0.18 + G.atak * 0.01; if (r < ata) { G.skor[1]++; logla(Math.round(G.dk + 5), 'İNEGÖL kontra atağında golü buldu.', 'k'); G.puan -= 0.2; } else if (r < ata + 0.3) logla(Math.round(G.dk + 5), 'İNEGÖL tehlikeli geliyordu, savunma temizledi.'); skorYaz(); }
function macSonu() { G.faz = 'son'; G.dk = 90; skorYaz(); const [a, b] = G.skor, sonuc = a > b ? 'GALİBİYET!' : a < b ? 'MAĞLUBİYET' : 'BERABERLİK', p = Math.max(1, Math.min(10, G.puan + (a > b ? 0.8 : a < b ? -0.6 : 0))).toFixed(1), ov = $('ov'); ov.style.display = 'flex';
  ov.innerHTML = `<h1>${sonuc}</h1><div style="font-size:42px;font-weight:900">${a} - ${b}</div><p>Şut ${G.istat.sut} (isabet ${G.istat.isabet}) · Gol ${G.istat.gol} · Asist ${G.istat.asist} · Pas ${G.istat.pas}<br>Maçın puanı: <b style="color:#ffd54a">${p}</b></p><button id="tek">Tekrar oyna</button>`; $('tek').onclick = basla; }
/* ---------- girdi: parmakla yön + güç ---------- */
let down = null; const MAXP = 150;
cv.addEventListener('pointerdown', (e) => { if (G.faz !== 'oyna' || !G.top.tasiyan) return; cv.setPointerCapture(e.pointerId); down = { x: e.clientX, y: e.clientY }; G.aim = { dx: 0, dy: 0, p: 0 }; hint(''); });
cv.addEventListener('pointermove', (e) => { if (!down || !G.aim) return; const dx = e.clientX - down.x, dy = e.clientY - down.y, l = Math.hypot(dx, dy); G.aim = { dx: dx / (l || 1), dy: dy / (l || 1), p: Math.min(1, l / MAXP), l }; });
const birak = () => { if (!down) return; const a = G.aim; down = null; G.aim = null; if (!a || a.l < 14 || G.faz !== 'oyna' || !G.top.tasiyan) return; atis(a.dx, a.dy, a.p); };
cv.addEventListener('pointerup', birak); cv.addEventListener('pointercancel', () => { down = null; G.aim = null; });
function atis(dx, dy, p) { const top = G.top, m = top.tasiyan; if (!m) return; const v = (12 + 70 * p) / 1.88 + 1.2; top.son = m; top.tasiyan = null; G.gk.rt = 0; top.vx = dx * v; top.vy = dy * v; if (m.y < 38 && dy < -0.2) hint(''); }
/* ---------- çizim ---------- */
function ciz() {
  const c = cx; c.setTransform(1, 0, 0, 1, 0, 0); c.clearRect(0, 0, cv.width, cv.height); c.fillStyle = '#143d22'; c.fillRect(0, 0, cv.width, cv.height);
  if (sarsinti > 0) c.translate((Math.random() - 0.5) * 6 * dpr, (Math.random() - 0.5) * 6 * dpr);
  for (let i = 0; i < 12; i++) { c.fillStyle = i % 2 ? '#2f8a3c' : '#2a7d36'; c.fillRect(toX(0), toY(i * H / 12), W * sc, H / 12 * sc + 1); }
  c.strokeStyle = 'rgba(255,255,255,.85)'; c.lineWidth = 2 * dpr; const L = (x, y, w, h) => c.strokeRect(toX(x), toY(y), w * sc, h * sc); L(0, 0, W, H); L(13.8, 0, 40.3, 16.5); L(24.8, 0, 18.3, 5.5); c.beginPath(); c.moveTo(toX(0), toY(H / 2)); c.lineTo(toX(W), toY(H / 2)); c.stroke(); c.beginPath(); c.arc(toX(W / 2), toY(H / 2), 9.15 * sc, 0, 7); c.stroke(); c.beginPath(); c.arc(toX(W / 2), toY(11), 9.15 * sc, 0.2 * Math.PI, 0.8 * Math.PI); c.stroke();
  c.fillStyle = '#fff'; c.fillRect(toX(GX0), toY(-1.6), GOAL_W * sc, 1.6 * sc); c.fillStyle = 'rgba(0,0,0,.25)'; c.fillRect(toX(GX0) + 3, toY(-1.4), GOAL_W * sc - 6, 1.2 * sc);
  const P = (o, col, r) => { c.fillStyle = 'rgba(0,0,0,.3)'; c.beginPath(); c.ellipse(toX(o.x), toY(o.y) + r * .7, r, r * .5, 0, 0, 7); c.fill(); c.fillStyle = col; c.beginPath(); c.arc(toX(o.x), toY(o.y), r, 0, 7); c.fill(); c.strokeStyle = 'rgba(0,0,0,.5)'; c.lineWidth = 1.5 * dpr; c.stroke(); };
  if (!G.gk) return; P(G.gk, '#d4d4d4', 1.3 * sc); for (const o of G.op) P(o, '#c0392b', 1.25 * sc); for (const t of G.tm) P(t, '#f2c518', 1.25 * sc);
  const me = G.me; if (me && G.top.tasiyan) { P(me, '#ffe066', 1.45 * sc); c.strokeStyle = '#fff'; c.lineWidth = 2.5 * dpr; c.beginPath(); c.arc(toX(me.x), toY(me.y), 2.4 * sc, 0, 7); c.stroke(); }
  // nişan çizgisi: yön + güç, çizgi boyunca hedef önizlemesi
  if (G.aim && G.aim.p > 0 && G.top.tasiyan) { const a = G.aim, m = G.top.tasiyan, len = (4 + 28 * a.p), ex = m.x + a.dx * len, ey = m.y + a.dy * len; c.strokeStyle = `hsl(${120 - 120 * a.p},90%,60%)`; c.lineWidth = (3 + 4 * a.p) * dpr; c.setLineDash([8 * dpr, 6 * dpr]); c.beginPath(); c.moveTo(toX(m.x), toY(m.y)); c.lineTo(toX(ex), toY(ey)); c.stroke(); c.setLineDash([]); c.fillStyle = c.strokeStyle; c.beginPath(); c.arc(toX(ex), toY(ey), 1.1 * sc, 0, 7); c.fill(); }
  const t = G.top; c.fillStyle = '#fff'; c.beginPath(); c.arc(toX(t.x), toY(t.y) - (t.tasiyan ? 0 : 3), 0.9 * sc, 0, 7); c.fill(); c.strokeStyle = '#222'; c.lineWidth = 1.5 * dpr; c.stroke();
  // güç göstergesi
  if (G.aim && G.aim.p > 0) { c.fillStyle = 'rgba(0,0,0,.5)'; c.fillRect(cv.width - 30 * dpr, cv.height * 0.3, 14 * dpr, cv.height * 0.4); c.fillStyle = `hsl(${120 - 120 * G.aim.p},90%,55%)`; c.fillRect(cv.width - 30 * dpr, cv.height * 0.7 - cv.height * 0.4 * G.aim.p, 14 * dpr, cv.height * 0.4 * G.aim.p); }
}
let son = performance.now(); function dongu(n) { requestAnimationFrame(dongu); const dt = Math.min(0.05, (n - son) / 1000); son = n; adim(dt); ciz(); } 
function basla() { Object.assign(G, { skor: [0, 0], dk: 0, atak: 0, faz: 'ön', log: [], istat: { sut: 0, isabet: 0, pas: 0, gol: 0, asist: 0, kayip: 0 }, puan: 6 }); $('log').innerHTML = ''; $('ov').style.display = 'none'; skorYaz(); logla(0, 'Maç başladı! SANLIU – İNEGÖL.'); yeniAtak(); }
fit(); basla(); requestAnimationFrame(dongu); window.__g = { G, atis, adim, fit };
</script></body></html>
