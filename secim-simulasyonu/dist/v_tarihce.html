<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Seçim Simülasyonu</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>/* Plan: koyu, gazete-ofisi hissi. Tek tema (bilinçli): kömür zemin, kırmızı mühür, altın vurgu. Düzen: tek sütun, sticky üst bar, alt sekmeler. */
:root{
  --bg:#0c0d12;--p1:#15171e;--p2:#1d202a;--p3:#262a36;--line:#2b2f3c;
  --ink:#eceef4;--mute:#9aa1b4;--ac:#e63b5f;--ac2:#ff6a86;--gold:#dcab4a;
  --ok:#3fc27a;--bad:#ff5d6c;--info:#5ea0ff;--r:16px;
  --fd:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;--fb:'IBM Plex Sans','Segoe UI',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--fb);overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
h1,h2,h3{font-family:var(--fd);margin:0;text-wrap:balance}
#app{height:100%;display:flex;flex-direction:column;max-width:560px;margin:0 auto;position:relative}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:12px 14px 150px;-webkit-overflow-scrolling:touch}
.muted{color:var(--mute)}.small{font-size:12.5px}.tiny{font-size:11.5px}.num{font-variant-numeric:tabular-nums}
.good{color:var(--ok)}.badc{color:var(--bad)}.warnc{color:var(--gold)}

/* üst bar */
.top{padding:max(10px,env(safe-area-inset-top)) 14px 6px;background:var(--bg);border-bottom:1px solid var(--line);position:relative;z-index:5}
.ttl{display:flex;align-items:center;gap:8px;min-height:36px}
.ttl b{font-family:var(--fd);font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46%}
.dot{width:11px;height:11px;border-radius:50%;flex:none}
.date{margin-left:auto;background:var(--p2);border:1px solid var(--line);border-radius:999px;padding:3px 11px;font-size:13px;font-weight:600}
.ib{display:flex;gap:6px}
.ib button{width:34px;height:34px;border-radius:50%;background:var(--p2);border:1px solid var(--line);font-weight:700}
.stats{display:flex;gap:8px;overflow-x:auto;padding:8px 0 4px;scrollbar-width:none}
.stats::-webkit-scrollbar{display:none}
.st{flex:none;background:var(--p1);border:1px solid var(--line);border-radius:12px;padding:5px 10px;font-size:13px;white-space:nowrap}
.st span{color:var(--mute);font-size:11px;display:block;letter-spacing:.02em}
.st b{font-variant-numeric:tabular-nums}

/* sekmeler */
.tabs{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(to top,var(--bg) 70%,rgba(12,13,18,0));padding:16px 8px max(8px,env(safe-area-inset-bottom));display:flex;gap:6px;overflow-x:auto;z-index:6;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:9px 14px;border-radius:12px;background:var(--p1);border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--mute)}
.tab[aria-current=true]{background:rgba(230,59,95,.16);border-color:var(--ac);color:var(--ink)}
.fab{position:absolute;right:14px;bottom:calc(64px + env(safe-area-inset-bottom));z-index:7;background:var(--ac);color:#fff;border-radius:999px;padding:12px 18px;font-weight:700;display:flex;align-items:center;gap:8px;box-shadow:0 6px 22px rgba(230,59,95,.35)}
.fab i{font-style:normal;background:rgba(0,0,0,.28);border-radius:999px;padding:1px 9px;font-size:13px}
.fab[disabled]{opacity:.5}

/* kartlar */
.card{background:var(--p1);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.card h3{font-size:15px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card h3 small{font-family:var(--fb);font-weight:500;color:var(--mute);font-size:12px}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin:16px 2px 8px;font-weight:600}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row .k{color:var(--mute)}
.bar{height:6px;border-radius:99px;background:var(--p3);overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;border-radius:99px;background:var(--ac)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{display:block;width:100%;text-align:center;padding:12px 14px;border-radius:13px;background:var(--p2);border:1px solid var(--line);font-weight:600}
.btn.pri{background:var(--ac);border-color:var(--ac);color:#fff}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#1a1405}
.btn.ghost{background:transparent}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn small{display:block;font-weight:400;color:inherit;opacity:.7;font-size:11.5px;margin-top:2px}
.aks{text-align:left;padding:11px 12px;border-radius:13px;background:var(--p2);border:1px solid var(--line);display:block;width:100%}
.aks b{display:block;font-size:14px}.aks span{display:block;font-size:11.5px;color:var(--mute);margin-top:2px;line-height:1.3}
.aks[disabled]{opacity:.4}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11px;font-weight:600;background:var(--p3);color:var(--mute);letter-spacing:.03em}
.pill.ac{background:rgba(230,59,95,.18);color:var(--ac2)}.pill.go{background:rgba(220,171,74,.18);color:var(--gold)}.pill.ok{background:rgba(63,194,122,.16);color:var(--ok)}
.chiprow{display:flex;gap:6px;flex-wrap:wrap}
.cx{padding:6px 11px;border-radius:99px;border:1px solid var(--line);background:var(--p2);font-size:12.5px;font-weight:600;color:var(--mute)}
.cx.on{background:rgba(230,59,95,.18);border-color:var(--ac);color:var(--ink)}
.fx{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:99px;font-size:11.5px;font-weight:600;background:var(--p3)}
.fx.iyi{color:var(--ok)}.fx.kotu{color:var(--bad)}
.fxs{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}

/* partiler/anket */
.pr{display:grid;grid-template-columns:10px 1fr auto;gap:10px;align-items:center;padding:7px 0}
.pr .nm{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.pr.me .nm b{color:var(--gold)}
.pbar{height:5px;border-radius:99px;background:var(--p3);margin-top:4px;overflow:hidden}.pbar i{display:block;height:100%}

/* harita */
.map{display:grid;gap:3px;grid-template-columns:repeat(19,1fr);margin:6px 0 10px}
.cell{aspect-ratio:1;border-radius:4px;font-size:8.5px;font-weight:700;display:flex;align-items:center;justify-content:center;color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.5);border:1px solid transparent;padding:0;font-variant-numeric:tabular-nums}
.cell.no{opacity:.45}.cell.ghost{visibility:hidden}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--mute)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* sheet */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.62);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fi .18s ease}
.sh{background:var(--p1);width:100%;max-width:560px;max-height:88%;overflow-y:auto;border-radius:22px 22px 0 0;border-top:3px solid var(--gold);padding:18px 16px max(22px,env(safe-area-inset-bottom));animation:up .22s ease}
.sh.blue{border-top-color:var(--info)}.sh.red{border-top-color:var(--ac)}
.sh h2{font-size:21px;margin:6px 0 8px}
.sh .lab{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);font-weight:600}
.opt{display:block;width:100%;text-align:left;background:var(--p2);border:1px solid var(--line);border-radius:14px;padding:13px;margin-top:8px}
.opt b{display:block;font-size:14.5px}
.news{background:#ece6d6;color:#1c1a14;border-radius:6px;padding:12px 14px;font-family:Georgia,'Times New Roman',serif;margin:10px 0}
.news b{font-size:17px;display:block;line-height:1.2}
.toast{position:fixed;left:50%;top:max(12px,env(safe-area-inset-top));transform:translateX(-50%);background:var(--p3);border:1px solid var(--line);border-radius:14px;padding:10px 14px;z-index:90;max-width:min(92%,520px);box-shadow:0 8px 30px rgba(0,0,0,.5);animation:fi .2s ease;font-size:13.5px}
@keyframes fi{from{opacity:0}to{opacity:1}}@keyframes up{from{transform:translateY(40px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

/* menü */
.menu{flex:1;overflow-y:auto;padding:max(28px,env(safe-area-inset-top)) 18px 30px;display:flex;flex-direction:column;gap:12px}
.hero{text-align:center;padding:26px 0 8px}
.hero svg{width:92px;height:92px}
.hero h1{font-size:34px;letter-spacing:-.02em;margin-top:12px}
.hero p{color:var(--mute);margin:6px 0 0}
.modc{display:block;width:100%;text-align:left;background:var(--p1);border:1px solid var(--line);border-left:4px solid var(--ac);border-radius:14px;padding:14px}
.modc[disabled]{opacity:.5;border-left-color:var(--line)}
.modc h3{font-size:17px;display:flex;gap:8px;align-items:center}
.fld{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.fld label{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);font-weight:600}
.in{background:var(--p1);border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:12px;font:inherit;width:100%}
.sw{display:flex;gap:8px;flex-wrap:wrap}.sw button{width:34px;height:34px;border-radius:50%;border:2px solid transparent}
.sw button.on{border-color:#fff}
svg text{font-family:var(--fb)}

/* ===== hareket ===== */
button{transition:transform .12s ease,background .2s ease,border-color .2s ease}
button:active:not([disabled]){transform:scale(.96)}
.ov{backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);background:rgba(4,5,9,.66)}
.sh{animation:spring .42s cubic-bezier(.2,.9,.25,1.12);position:relative}
.sh .hd{width:42px;height:4px;border-radius:9px;background:var(--line);margin:-6px auto 10px}
.sh .opt,.sh .btn,.sh .row,.sh .news,.sh .card{animation:rise .45s cubic-bezier(.2,.8,.3,1) both}
.sh>*:nth-child(3){animation-delay:.05s}.sh>*:nth-child(4){animation-delay:.1s}.sh>*:nth-child(5){animation-delay:.15s}.sh>*:nth-child(6){animation-delay:.2s}.sh>*:nth-child(7){animation-delay:.25s}.sh>*:nth-child(8){animation-delay:.3s}
@keyframes spring{from{transform:translateY(60%);opacity:.4}to{transform:none;opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.4)}60%{transform:scale(1.12)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.scroll.anim>*{animation:rise .5s cubic-bezier(.2,.8,.3,1) both}
.scroll.anim>*:nth-child(2){animation-delay:.05s}.scroll.anim>*:nth-child(3){animation-delay:.1s}.scroll.anim>*:nth-child(4){animation-delay:.15s}.scroll.anim>*:nth-child(5){animation-delay:.2s}.scroll.anim>*:nth-child(n+6){animation-delay:.25s}
.scroll.anim .bar i,.scroll.anim .pbar i{transform-origin:left;animation:grow .8s cubic-bezier(.2,.8,.3,1) both .15s}
.scroll.anim .cell{animation:pop .45s both;animation-delay:calc(var(--d)*1ms)}
.fx{animation:pop .45s both}.fx .e{font-size:13px;margin-right:2px}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:62px;padding:7px 10px 6px;font-size:11.5px}
.tab .ti{font-size:20px;line-height:1.1;filter:grayscale(.6) opacity(.75);transition:transform .2s,filter .2s}
.tab[aria-current=true] .ti{filter:none;transform:translateY(-2px) scale(1.18)}
.fab{animation:glow 2.2s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 6px 22px rgba(230,59,95,.35)}50%{box-shadow:0 6px 30px rgba(230,59,95,.75)}}
.st b.fu{color:var(--ok);animation:bump .6s}.st b.fd{color:var(--bad);animation:bump .6s}
@keyframes bump{40%{transform:scale(1.18)}}
.hint{position:absolute;left:14px;right:14px;bottom:calc(120px + env(safe-area-inset-bottom));z-index:8;background:var(--p3);border:1px solid var(--line);border-radius:14px;padding:11px 14px;font-size:13px;animation:rise .4s both,fo .4s 4.1s forwards;box-shadow:0 8px 28px rgba(0,0,0,.5)}
@keyframes fo{to{opacity:0;transform:translateY(8px)}}
.tick{display:flex;align-items:center;background:#a8142c;color:#fff;font-size:11.5px;font-weight:600;letter-spacing:.03em;overflow:hidden;height:26px;flex:none}
.tick .tb{background:#fff;color:#a8142c;padding:0 9px;height:100%;display:flex;align-items:center;font-weight:700;flex:none;z-index:1}
.tw{overflow:hidden;flex:1}.tk{display:flex;white-space:nowrap;width:max-content;animation:mq 38s linear infinite}
.tk span{padding-right:8px}@keyframes mq{to{transform:translateX(-50%)}}
.mt{position:fixed;inset:0;z-index:70;background:radial-gradient(circle at 50% 40%,#2a1020,#0a0a10 70%);display:flex;align-items:center;justify-content:center;animation:fi .2s}
.mt.out{opacity:0;transition:opacity .3s}
.mt-in{text-align:center;padding:24px}
.mt-e{font-size:64px;animation:flip 1s ease-in-out}
.mt-a{font-family:var(--fd);font-size:26px;font-weight:700;margin-top:10px}.mt-s{color:var(--mute);margin-top:6px;font-size:14px}
.mt-b{width:160px;height:4px;border-radius:9px;background:var(--p3);margin:20px auto 0;overflow:hidden}.mt-b i{display:block;height:100%;background:var(--ac);animation:fill 1.1s linear both}
@keyframes flip{0%{transform:rotateY(0) scale(.6)}50%{transform:rotateY(180deg) scale(1.15)}100%{transform:rotateY(360deg) scale(1)}}
@keyframes fill{from{width:0}to{width:100%}}
.splash{position:fixed;inset:0;z-index:80;display:flex;flex-direction:column;background:radial-gradient(ellipse at 50% 38%,#3a1022 0%,#0b0b12 62%);animation:fi .35s;overflow:hidden}
.splash.b{background:radial-gradient(ellipse at 50% 38%,#10223d 0%,#0b0b12 62%)}
.splash.out{opacity:0;transition:opacity .3s}
.splash .cf{position:absolute;inset:0;pointer-events:none;width:100%;height:100%}
.gec{position:absolute;right:16px;top:max(16px,env(safe-area-inset-top));z-index:3;border:1px solid var(--line);border-radius:999px;padding:8px 16px;font-weight:600;font-size:13px;background:rgba(0,0,0,.35)}
.sp-c{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px 22px;position:relative;z-index:2;max-width:560px;margin:0 auto;width:100%}
.sp-i{font-size:76px;animation:pop .8s cubic-bezier(.2,.9,.3,1.3) both .1s;filter:drop-shadow(0 0 28px rgba(230,59,95,.55))}
.sp-u{font-size:11.5px;letter-spacing:.34em;color:var(--ac2);font-weight:700;margin-top:14px;animation:rise .6s both .35s}
.sp-c h1{font-size:30px;line-height:1.1;margin-top:10px;animation:rise .7s both .5s}
.sp-a{color:var(--mute);margin-top:8px;animation:rise .6s both .7s}
.sp-l{color:#cfd3e0;font-size:14.5px;margin-top:10px;animation:rise .6s both}
.sp-l:nth-of-type(1){animation-delay:.9s}.sp-l:nth-of-type(2){animation-delay:1.1s}.sp-l:nth-of-type(3){animation-delay:1.3s}
.sp-q{margin-top:22px;border-left:3px solid var(--ac);background:rgba(255,255,255,.05);padding:10px 14px;text-align:left;font-size:13px;width:100%;animation:rise .6s both 1.5s}
.sp-q b{display:block;color:var(--ac2);font-size:11px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:2px}
.sp-d{margin-top:26px;width:auto!important;padding:12px 40px!important;animation:rise .6s both 1.7s}
.sp-t{background:#a8142c;color:#fff;font-weight:700;font-size:12px;letter-spacing:.04em;padding:8px 0;overflow:hidden;position:relative;z-index:2}
.sp-tk{display:flex;white-space:nowrap;width:max-content;animation:mq 26s linear infinite}
.hero svg{animation:pop .8s cubic-bezier(.2,.9,.3,1.3) both,floaty 4s ease-in-out infinite .8s;filter:drop-shadow(0 0 24px rgba(230,59,95,.45))}
@keyframes floaty{50%{transform:translateY(-6px)}}
.hero h1{animation:rise .6s both .25s}.hero p{animation:rise .6s both .4s}
.menu>.btn,.menu>.modc{animation:rise .5s both}
.menu>*:nth-child(2){animation-delay:.5s}.menu>*:nth-child(3){animation-delay:.6s}.menu>*:nth-child(4){animation-delay:.7s}
.menu::before{content:'';position:fixed;inset:0;background:radial-gradient(circle at 50% 0%,rgba(230,59,95,.18),transparent 55%);pointer-events:none}
@media (prefers-reduced-motion:reduce){.tk,.sp-tk{animation:none}}
.scroll{scrollbar-width:none}.scroll::-webkit-scrollbar{display:none}

/* ===== harita ===== */
.mapc{position:relative;background:var(--p1);border:1px solid var(--line);border-radius:var(--r);margin:10px 0;height:min(58vw,300px);overflow:hidden;touch-action:none;cursor:grab}
.mapc svg{width:100%;height:100%;display:block}
.mapc path,.g-map path{stroke:#0c0d12;stroke-width:.6px;vector-effect:non-scaling-stroke;transition:fill .5s;cursor:pointer}
.mapc path:hover{filter:brightness(1.25)}
.mz{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px}
.mz button{width:34px;height:34px;border-radius:10px;background:rgba(21,23,30,.9);border:1px solid var(--line);font-size:18px;font-weight:700}
.sdb{position:fixed;left:10px;right:10px;top:max(10px,env(safe-area-inset-top));z-index:120;max-width:540px;margin:0 auto;display:flex;align-items:stretch;background:#fff;color:#14141a;border-radius:10px;overflow:hidden;box-shadow:0 10px 34px rgba(0,0,0,.55);animation:sdin .5s cubic-bezier(.2,.9,.3,1.15)}
.sdb.out{opacity:0;transform:translateY(-20px);transition:.4s}
.sdt{background:#d4152f;color:#fff;font-weight:700;font-size:11px;letter-spacing:.08em;padding:10px 10px;display:flex;align-items:center;gap:6px;flex:none}
.sdt i{width:8px;height:8px;border-radius:50%;background:#fff;animation:blink 1s infinite}
.sdm{padding:10px 12px;font-size:13px;font-weight:600;line-height:1.3}
@keyframes sdin{from{transform:translateY(-90px);opacity:0}to{transform:none;opacity:1}}@keyframes blink{50%{opacity:.2}}
/* seçim gecesi */
.gece{position:fixed;inset:0;z-index:85;background:radial-gradient(ellipse at 50% 0%,#1d1530 0%,#0a0a10 60%);display:flex;flex-direction:column;max-width:560px;margin:0 auto;animation:fi .4s}
.gece.out{opacity:0;transition:opacity .3s}
.g-top{display:flex;justify-content:space-between;align-items:flex-end;padding:max(14px,env(safe-area-inset-top)) 16px 8px}
.g-top b{font-family:var(--fd);font-size:20px}
.g-pc{text-align:right;font-family:var(--fd);font-size:26px;font-weight:700;line-height:1}.g-pc span{display:block;font-family:var(--fb);font-size:10.5px;color:var(--mute);font-weight:500;margin-top:3px}
.g-body{flex:1;overflow-y:auto;padding:4px 16px 8px;scrollbar-width:none}.g-body::-webkit-scrollbar{display:none}
.g-body.in{animation:rise .5s both}
.g-map{height:clamp(120px,32vh,230px)}.g-map svg{width:100%;height:100%;display:block}
.g-ic{min-height:58px;margin:4px 0 8px}
.gc{background:var(--p2);border:1px solid var(--line);border-left:4px solid var(--gold);border-radius:12px;padding:9px 12px;animation:pop .35s both}
.gh{display:flex;align-items:center;gap:8px}.gh .dot{display:inline-block}
.gl{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;margin-top:5px;color:var(--mute)}.gl i{display:inline-block;width:8px;height:8px;border-radius:3px;margin-right:4px}
.g-bd .gr{display:grid;grid-template-columns:10px minmax(0,1.2fr) minmax(0,1fr) auto auto;gap:8px;align-items:center;padding:6px 0;font-size:13.5px}
.gn small{display:block;font-size:11px;color:var(--mute)}
.gbar{height:7px;background:var(--p3);border-radius:9px;overflow:hidden}.gbar i{display:block;height:100%;width:0;border-radius:9px;transition:width .5s cubic-bezier(.2,.8,.3,1)}
